<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1160" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1160" fill="#ffffff"/>

  <text x="750" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#003da5">Technical Assessment Platform — Arquitectura</text>
  <text x="750" y="72" text-anchor="middle" font-size="15" fill="#5b6b88">Stack por capa y motor de ejecución de código</text>

  <!-- Cliente -->
  <rect x="480" y="100" width="540" height="120" rx="10" fill="#e8eff9" stroke="#003da5" stroke-width="1.5"/>
  <text x="750" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#00256b">Cliente — Navegador</text>
  <text x="750" y="152" text-anchor="middle" font-size="13" fill="#1f2a44">React 19 + Vite + TypeScript</text>
  <text x="750" y="172" text-anchor="middle" font-size="13" fill="#1f2a44">Monaco Editor (editor de VS Code)</text>
  <text x="750" y="192" text-anchor="middle" font-size="13" fill="#1f2a44">React Router · Axios</text>

  <line x1="750" y1="220" x2="750" y2="270" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="768" y="248" font-size="12" fill="#334155">HTTPS + JWT (Bearer)</text>

  <!-- API -->
  <rect x="230" y="270" width="1040" height="175" rx="10" fill="#eef0fb" stroke="#4338ca" stroke-width="1.5"/>
  <text x="255" y="298" font-size="16" font-weight="700" fill="#312e81">API — Node.js 22 + Express 5</text>

  <rect x="255" y="315" width="300" height="110" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="405" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Autenticación</text>
  <text x="405" y="358" text-anchor="middle" font-size="11.5" fill="#334155">JWT firmado, sesión 8 h</text>
  <text x="405" y="376" text-anchor="middle" font-size="11.5" fill="#334155">Contraseñas con scrypt + salt</text>
  <text x="405" y="394" text-anchor="middle" font-size="11.5" fill="#334155">Bloqueo tras 8 intentos fallidos</text>
  <text x="405" y="412" text-anchor="middle" font-size="11.5" fill="#334155">Roles: ADMIN · EVALUATOR · CANDIDATE</text>

  <rect x="570" y="315" width="300" height="110" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="720" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Rutas REST</text>
  <text x="720" y="358" text-anchor="middle" font-size="11.5" fill="#334155">/assessments · /questions</text>
  <text x="720" y="376" text-anchor="middle" font-size="11.5" fill="#334155">/users · /submissions</text>
  <text x="720" y="394" text-anchor="middle" font-size="11.5" fill="#334155">/auth (login · registro · password)</text>
  <text x="720" y="412" text-anchor="middle" font-size="11.5" fill="#334155">Validación por rol en cada endpoint</text>

  <rect x="885" y="315" width="355" height="110" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="1062" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Documentación</text>
  <text x="1062" y="358" text-anchor="middle" font-size="11.5" fill="#334155">OpenAPI (openapi.yaml)</text>
  <text x="1062" y="376" text-anchor="middle" font-size="11.5" fill="#334155">Swagger UI servido en /docs</text>
  <text x="1062" y="394" text-anchor="middle" font-size="11.5" fill="#334155">Botón Authorize con el JWT</text>

  <!-- Rama datos -->
  <line x1="400" y1="445" x2="400" y2="500" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="478" font-size="12" fill="#334155">Prisma ORM</text>

  <rect x="230" y="500" width="340" height="110" rx="10" fill="#e8f5e9" stroke="#138a4b" stroke-width="1.5"/>
  <text x="400" y="528" text-anchor="middle" font-size="15" font-weight="700" fill="#0d5f33">Datos — PostgreSQL 16</text>
  <text x="400" y="552" text-anchor="middle" font-size="12" fill="#1f2a44">Usuarios, assessments, preguntas,</text>
  <text x="400" y="570" text-anchor="middle" font-size="12" fill="#1f2a44">casos de prueba, intentos y envíos</text>
  <text x="400" y="592" text-anchor="middle" font-size="11.5" fill="#5b6b88">docker compose · Prisma Migrate</text>

  <!-- Rama ejecución -->
  <line x1="1000" y1="445" x2="1000" y2="500" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1015" y="478" font-size="12" fill="#334155">docker run --rm</text>
  <text x="1015" y="493" font-size="11" fill="#5b6b88">1 ejecución = 1 contenedor</text>

  <!-- Motor de ejecución -->
  <rect x="230" y="640" width="1040" height="420" rx="10" fill="#fff2e0" stroke="#c2410c" stroke-width="1.5"/>
  <text x="255" y="668" font-size="16" font-weight="700" fill="#7c2d12">Motor de ejecución — Docker Engine (host)</text>
  <text x="255" y="690" font-size="12.5" fill="#7c2d12">Contenedor efímero por ejecución, se destruye al terminar (--rm)</text>

  <!-- 5 runners -->
  <g>
    <rect x="255" y="710" width="188" height="150" rx="8" fill="#ffffff" stroke="#fb923c" stroke-dasharray="5 4"/>
    <text x="349" y="735" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">JavaScript</text>
    <text x="349" y="755" text-anchor="middle" font-size="11" fill="#334155">node:20-slim</text>
    <text x="349" y="775" text-anchor="middle" font-size="10.5" fill="#5b6b88">imagen oficial</text>
    <text x="349" y="798" text-anchor="middle" font-size="10.5" fill="#5b6b88">node solution.js</text>
  </g>
  <g>
    <rect x="453" y="710" width="188" height="150" rx="8" fill="#ffffff" stroke="#fb923c" stroke-dasharray="5 4"/>
    <text x="547" y="735" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">Python</text>
    <text x="547" y="755" text-anchor="middle" font-size="11" fill="#334155">python:3.12-slim</text>
    <text x="547" y="775" text-anchor="middle" font-size="10.5" fill="#5b6b88">imagen oficial</text>
    <text x="547" y="798" text-anchor="middle" font-size="10.5" fill="#5b6b88">python solution.py</text>
  </g>
  <g>
    <rect x="651" y="710" width="188" height="150" rx="8" fill="#ffffff" stroke="#fb923c" stroke-dasharray="5 4"/>
    <text x="745" y="735" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">Java</text>
    <text x="745" y="755" text-anchor="middle" font-size="11" fill="#334155">eclipse-temurin:21-jdk</text>
    <text x="745" y="775" text-anchor="middle" font-size="10.5" fill="#5b6b88">imagen oficial</text>
    <text x="745" y="798" text-anchor="middle" font-size="10.5" fill="#5b6b88">javac + java Main</text>
  </g>
  <g>
    <rect x="849" y="710" width="188" height="150" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="5 4"/>
    <text x="943" y="735" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">TypeScript</text>
    <text x="943" y="755" text-anchor="middle" font-size="11" fill="#334155">kata-runner-typescript</text>
    <text x="943" y="775" text-anchor="middle" font-size="10.5" fill="#5b6b88">Dockerfile propio</text>
    <text x="943" y="798" text-anchor="middle" font-size="10.5" fill="#5b6b88">tsc + node</text>
  </g>
  <g>
    <rect x="1047" y="710" width="188" height="150" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="5 4"/>
    <text x="1141" y="735" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">COBOL</text>
    <text x="1141" y="755" text-anchor="middle" font-size="11" fill="#334155">kata-runner-cobol</text>
    <text x="1141" y="775" text-anchor="middle" font-size="10.5" fill="#5b6b88">Dockerfile propio</text>
    <text x="1141" y="798" text-anchor="middle" font-size="10.5" fill="#5b6b88">cobc (GnuCOBOL)</text>
  </g>

  <!-- limites compartidos -->
  <rect x="255" y="880" width="980" height="150" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="745" y="905" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">Sandbox aplicado a cada contenedor</text>
  <text x="280" y="930" font-size="11.5" fill="#334155">• --network none (sin red)</text>
  <text x="280" y="950" font-size="11.5" fill="#334155">• --read-only + tmpfs con tamaño</text>
  <text x="280" y="970" font-size="11.5" fill="#334155">• usuario nobody, --cap-drop ALL, no-new-privileges</text>
  <text x="680" y="930" font-size="11.5" fill="#334155">• --memory 256-512m sin swap · --cpus 0.5</text>
  <text x="680" y="950" font-size="11.5" fill="#334155">• --pids-limit 256 · timeout 5s/caso (SIGKILL)</text>
  <text x="680" y="970" font-size="11.5" fill="#334155">• 3 ejecuciones concurrentes, cola de 20, 1 por usuario</text>
  <text x="745" y="1000" text-anchor="middle" font-size="11" fill="#7c2d12">Inputs y resultados en un directorio solo de root: el candidato no lee los casos ocultos</text>

  <!-- Leyenda -->
  <g font-size="12" fill="#334155">
    <rect x="230" y="1095" width="16" height="16" fill="#e8eff9" stroke="#003da5"/>
    <text x="252" y="1108">Cliente</text>
    <rect x="330" y="1095" width="16" height="16" fill="#eef0fb" stroke="#4338ca"/>
    <text x="352" y="1108">API</text>
    <rect x="410" y="1095" width="16" height="16" fill="#e8f5e9" stroke="#138a4b"/>
    <text x="432" y="1108">Datos</text>
    <rect x="500" y="1095" width="16" height="16" fill="#fff2e0" stroke="#c2410c"/>
    <text x="522" y="1108">Ejecución</text>
    <rect x="610" y="1095" width="16" height="16" fill="#ffffff" stroke="#c2410c" stroke-dasharray="4 3"/>
    <text x="632" y="1108">Contenedor efímero (por ejecución)</text>
  </g>
</svg>
